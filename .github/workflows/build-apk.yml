name: Build Android APK

# 无需本地 Android Studio！推送代码到 GitHub 后，本工作流在云端
# 自动安装 JDK + Android SDK，编译出 app-debug.apk 供下载安装。
on:
  push:
    branches: [main, master]
  workflow_dispatch:   # 允许在 Actions 页面手动点“Run workflow”触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 JDK 17（Android Gradle 需要）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK 并自动接受许可协议
        uses: android-actions/setup-android@v3

      - name: 安装 Android 编译平台与构建工具
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 安装 npm 依赖（含 @capacitor/android）
        run: npm install

      - name: 构建 www/ 静态资源
        run: npm run build:www

      - name: 生成 Capacitor Android 原生工程
        run: npx cap add android

      - name: 同步 Web 资源到原生工程
        run: npx cap sync android

      - name: 编译 Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
