name: Build Android APK

# 无需本地 Android Studio！推送代码到 GitHub 后，本工作流在云端
# 自动安装 JDK + Android SDK，编译出 app-debug.apk 供下载安装。
on:
  push:
    branches: [main, master]
  workflow_dispatch:   # 允许在 Actions 页面手动点"Run workflow"触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'              # Node 22（Node 20 已弃用）
          cache: 'npm'                  # 缓存 npm 依赖（需 package-lock.json）

      - name: 配置 JDK 17（Android Gradle 需要）
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android 命令行工具（动态取最新版；ubuntu-latest 不预装 SDK）
        run: |
          # 确保 curl / unzip 可用（GitHub ubuntu runner 镜像可能精简掉基础工具，导致上一版 127）
          if ! command -v curl >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            echo "检测到 curl/unzip 缺失，通过 apt-get 安装..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq curl unzip
          fi
          export ANDROID_HOME=$RUNNER_TEMP/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          XML_URL='https://dl.google.com/android/repository/repository2-3.xml'
          # 动态解析 cmdline-tools-linux 最新下载地址，避免硬编码版本号 404
          TOOLS_ZIP=$(curl -fsSL "$XML_URL" | grep -oP '<url>\Kcommandlinetools-linux-[0-9]+(?:_latest)?\.zip' | head -1) || true
          if [ -z "$TOOLS_ZIP" ]; then
            echo "::error::无法从 $XML_URL 解析 cmdline-tools 下载地址"
            exit 1
          fi
          echo "下载 $TOOLS_ZIP ..."
          if ! curl -fsSL -o tools.zip "https://dl.google.com/android/repository/$TOOLS_ZIP"; then
            echo "::error::下载 $TOOLS_ZIP 失败"
            exit 1
          fi
          unzip -q tools.zip && mv cmdline-tools latest && rm tools.zip
          # 关键：$GITHUB_PATH 只对后续步骤生效，当前步骤必须 export PATH 才能找到 sdkmanager
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager --version

      - name: 接受许可证并安装平台/构建工具（Capacitor 5 → compileSdk 33）
        run: |
          # 第二个步骤也 export PATH 一次，防止 PATH 漂移导致 sdkmanager 找不到
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 同时装 33 和 34 + 对应 build-tools，兼容不同 Capacitor patch 版本
          sdkmanager "platform-tools" "platforms;android-33" "platforms;android-34" "build-tools;33.0.0" "build-tools;34.0.0"

      - name: 安装 npm 依赖（含 @capacitor/android、cli）
        run: npm ci 2>/dev/null || npm install

      - name: 构建 www/ 静态资源
        run: npm run build:www

      - name: 生成 Capacitor Android 原生工程
        run: npx cap add android

      - name: 同步 Web 资源到原生工程
        run: npx cap sync android

      - name: 编译 Debug APK
        run: |
          cd android
          # Capacitor 模板不生成 local.properties，AGP 8.x 在 CI 容器里有时找不到 SDK，
          # 显式写入 sdk.dir（ANDROID_HOME 由 step 5/6 导出过、这里直接读）
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
